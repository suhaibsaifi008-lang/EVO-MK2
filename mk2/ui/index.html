<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>EVO MK2 — Console</title>
<link rel="stylesheet" href="/ui/style.css?v=1"/>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="orb"></div><div><h1 id="brand">EVO<span>.MK2</span></h1><small>personal intelligence</small></div></div>
    <div class="foot">
      <label class="pill"><input type="checkbox" id="voiceOut" checked/><span>Voice replies</span></label>
      <span id="conn" class="dot offline" title="server"></span>
    </div>
  </aside>
  <main class="main">
    <header class="top"><h2>Console</h2><span id="engineTag" class="tag">…</span></header>
    <section class="stage">
      <div class="scroll">
        <div class="hero" id="hero">
          <h2 id="greet">Systems online.</h2>
          <p class="sub">Say “wake up evo”, or type below. I act — not just answer.</p>
        </div>
        <div id="log" class="log"></div>
      </div>
      <form id="chatForm" class="composer">
        <div id="sttPreview" class="stt-preview"></div>
        <div class="pillbar">
          <textarea id="chatInput" rows="1" placeholder="Message EVO…  (Enter to send · Esc to stop)"></textarea>
          <button type="button" id="stopBtn" class="btn stop">■</button>
          <button type="submit" class="btn send">➤</button>
        </div>
      </form>
    </section>
  </main>
</div>
<div id="toasts"></div>
<script src="/ui/app.js?v=1"></script>
</body>
</html>
