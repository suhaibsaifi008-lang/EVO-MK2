<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>EVO MK2</title>
<link rel="stylesheet" href="/ui/style.css?v=7"/>
</head>
<body>
<canvas id="faceCanvas"></canvas>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="orb-dot"></span><b>EVO<span class="v2">MK2</span></b></div>
    <button id="newChat" class="top-btn" onclick="location.reload()">+ New Chat</button><div class="spacer"></div><a href="/voice/client/" target="_blank" class="top-btn">Voice</a><a href="/face" target="_blank" class="top-btn">Face</a>
    <span id="engineTag" class="tag">�</span>
    <span id="conn" class="dot offline"></span>
  </header>

  <main class="main">
    <div class="scroll" id="scrollArea">
      <div class="hero" id="hero">
        <h1 id="greet">Systems online.</h1>
        <p>Ask anything, or use the mic. I act � not just answer.</p>
      </div>
      <div id="log" class="log"></div>
    </div>
  </main>

  <form id="chatForm" class="composer-wrap" autocomplete="off">
    <div id="sttPreview" class="stt-preview"></div>
    <div class="composer">
      <button type="button" id="convoBtn" class="icon-btn convo" title="Always-on conversation mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><circle cx="18" cy="5" r="4"/></svg>
      </button>
      <button type="button" id="pttBtn" class="icon-btn ptt" title="Push to talk">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
      </button>
      <textarea id="chatInput" rows="1" placeholder="Message EVO�"></textarea>
      <button type="button" id="stopBtn" class="icon-btn stop-btn hidden">�</button>
      <button type="submit" class="send-btn" title="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
      </button>
    </div>
    <div class="composer-foot">
      <label class="toggle"><input type="checkbox" id="voiceOut" checked/><span>?? Voice replies</span></label>
    </div>
  </form>
</div>
<div id="toasts"></div>
<script src="/ui/app.js?v=7"></script>
</body>
</html>
